<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>机长日志 · 起飞统计</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="日历式起飞记录 + 角色/标签统计工具，数据只保存在本机。">
<meta name="theme-color" content="#0f1117">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="机长日志">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-tab="calendar">
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true"></span>
        <span class="brand-text">
          <b>机长日志</b>
          <i>起飞记录 · 统计</i>
        </span>
      </div>
      <button id="today-chip" class="today-chip" type="button"></button>
    </header>

    <div id="reminder-bar" class="reminder-bar" aria-hidden="true"></div>

    <main id="view" role="main"></main>

    <button id="fab" class="fab" type="button"></button>

    <nav id="tabbar" role="tablist"></nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast-root"></div>

  <script src="js/util.js"></script>
  <script src="js/kit.js"></script>
  <script src="js/reminder-core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/view-editor.js"></script>
  <script src="js/view-calendar.js"></script>
  <script src="js/view-stats.js"></script>
  <script src="js/view-settings.js"></script>
  <script src="js/reminder.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
